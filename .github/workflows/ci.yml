name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The vision extra is installed so its modules type-check and import; no
          # network call is made, and no API key is available to this job.
          python -m pip install -e ".[dev,vision]"

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy .

      - name: Tests
        run: python -m pytest -q

      - name: Convert a committed diagram end to end
        run: |
          python main.py TwoBoxes.drawio -o "${RUNNER_TEMP}/out.drawio" --non-interactive
          test -s "${RUNNER_TEMP}/out.drawio"
